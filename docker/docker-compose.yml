name: llm-vrp

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: vrp-api:local
    ports:
      - "8000:8000"
    volumes:
      - ../artifacts/checkpoints:/app/artifacts/checkpoints:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
