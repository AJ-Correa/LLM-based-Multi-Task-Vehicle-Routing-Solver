[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp-decision-service"
version = "0.0.0"
description = "LLM-based VRP decision support"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2",
    "pytest>=8",
    "ruff>=0.8",
]
mtl = [
    "einops>=0.8",
    "numpy>=1.26",
    "pyyaml>=6",
    "tensordict>=0.6",
    "torchrl>=0.6",
]

# Pick one torch build: `cpu` for the API image, `gpu` (the PyPI CUDA wheel) for local runs.
[project.optional-dependencies]
cpu = ["torch>=2.6"]
gpu = ["torch>=2.6"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
